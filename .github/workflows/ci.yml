name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Types
        run: uv run mypy src
      - name: Tests (mock mode, no network)
        run: uv run pytest -q
        env:
          CATALYST_MODE: mock
