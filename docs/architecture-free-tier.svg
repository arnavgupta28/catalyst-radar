  <text x="30" y="860" font-size="11" fill="#64748b">Free: Databricks Free Edition (non-commercial, fair-use quota) · Vercel Hobby · GitHub Actions · Sentry · UptimeRobot · TinyFish Fetch/Search · free price APIs. Paid: TinyFish Agent, Claude (optional). Limits are reported values; verify before relying on them.</text>
